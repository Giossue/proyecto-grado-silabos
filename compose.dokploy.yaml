# Sílabos en Dokploy: solo la web, la API y el worker.
# PostgreSQL, Redis, Gotenberg y MinIO ya existen en el servidor y se alcanzan por `dokploy-network`.
# El bucket de MinIO se crea una vez en su panel. Las migraciones NO se ejecutan solas: antes de aplicarlas
# hay que respaldar la base. Después se ejecutan en la terminal de `silabos-api`:
#   node_modules/.bin/prisma migrate deploy
# Los nombres llevan el prefijo `silabos-` para no chocar con otros proyectos en la red compartida.
name: silabos-ueb

x-api-image: &api-image
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: silabos-ueb-api:latest

x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-production}
  APP_NAME: ${APP_NAME:-Sílabos UEB}
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  APP_LOCALE: ${APP_LOCALE:-es}
  API_PORT: "8000"
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-America/Guayaquil}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  POST_MAX_SIZE: ${POST_MAX_SIZE:-32M}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-240}
  SESSION_COOKIE_PREFIX: ${SESSION_COOKIE_PREFIX:-silabos-ueb}
  STATEFUL_DOMAINS: ${STATEFUL_DOMAINS:-localhost:3000}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  REDIS_PREFIX: ${REDIS_PREFIX:-silabos-ueb:}
  GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
  STORAGE_DRIVER: s3
  STORAGE_PATH: /data/storage
  PUBLIC_ASSETS_PATH: /app/assets
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-silabos}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  QUEUE_RETRY_AFTER: ${QUEUE_RETRY_AFTER:-90}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_SCHEME: ${MAIL_SCHEME:-}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Sílabos UEB}
  AI_DRIVER: ${AI_DRIVER:-}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_TEMPLATE_MODEL: ${AI_TEMPLATE_MODEL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_CONNECT_TIMEOUT: ${AI_CONNECT_TIMEOUT:-10}
  AI_TIMEOUT: ${AI_TIMEOUT:-120}
  CATALOG_DRIVER: ${CATALOG_DRIVER:-}
  KOHA_BASE_URL: ${KOHA_BASE_URL:-}
  SIGNATURE_TRUSTED_CA_BUNDLE: ${SIGNATURE_TRUSTED_CA_BUNDLE:-}
  SIGNATURE_REQUIRE_HOLDER_MATCH: ${SIGNATURE_REQUIRE_HOLDER_MATCH:-true}
  KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED:-}
  KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
  KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-}
  KEYCLOAK_POST_LOGOUT_REDIRECT_URI: ${KEYCLOAK_POST_LOGOUT_REDIRECT_URI:-}

services:
  silabos-api:
    <<: *api-image
    environment: *api-environment
    volumes:
      - storage:/data/storage
    networks: [default, dokploy-network]
    restart: unless-stopped

  silabos-worker:
    <<: *api-image
    command: ["node", "dist/apps/api/src/worker.js"]
    environment:
      <<: *api-environment
      QUEUE_MAX_TIME: "0"
    volumes:
      - storage:/data/storage
    healthcheck:
      disable: true
    networks: [default, dokploy-network]
    restart: unless-stopped

  silabos-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://silabos-api:8000
    image: silabos-ueb-web:latest
    environment:
      API_INTERNAL_URL: http://silabos-api:8000
    depends_on:
      silabos-api:
        condition: service_healthy
    networks: [default, dokploy-network]
    restart: unless-stopped

volumes:
  storage:

networks:
  dokploy-network:
    external: true
