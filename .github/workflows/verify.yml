name: Verificación

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: silabos_ueb_test
          POSTGRES_USER: silabos_ueb
          POSTGRES_PASSWORD: silabos_ueb
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U silabos_ueb -d silabos_ueb_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Descargar código sin conservar credenciales
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, intl, mbstring, pdo_pgsql, xml, zip
          coverage: none
          tools: composer:v2

      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Validar manifiesto Composer
        run: composer validate --strict --no-check-publish

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Auditar dependencias fijadas
        run: |
          composer audit --locked --no-interaction
          npm audit --audit-level=high

      - name: Preparar ambiente seguro
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Demostrar migración y seeding PostgreSQL
        env:
          DB_DATABASE: silabos_ueb_test
        run: php artisan migrate:fresh --seed --force

      # Wayfinder genera `resources/js/actions` y `resources/js/routes`, que no se
      # versionan. Sin ellos eslint no resuelve esos imports y los ordena distinto que en
      # local, con 64 falsos errores de `import/order`.
      - name: Generar helpers de rutas
        env:
          DB_DATABASE: silabos_ueb_test
        run: php artisan wayfinder:generate --with-form

      - name: Verificar aplicación
        env:
          DB_DATABASE: silabos_ueb_test
        run: composer verify
