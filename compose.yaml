name: silabos-ueb

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: silabos_ueb
      POSTGRES_USER: silabos_ueb
      POSTGRES_PASSWORD: silabos_ueb
      TZ: UTC
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      # postgres:18 coloca los datos en un subdirectorio de /var/lib/postgresql y aborta
      # si el volumen se monta en /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U silabos_ueb -d silabos_ueb']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:56379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
