user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # El sílabo exportado puede pesar; los tiempos siguen al límite de PHP.
    client_max_body_size 32m;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        # Puerto no privilegiado: la imagen arranca igual sin root y el orquestador mapea.
        listen 8080 default_server;
        root /var/www/html/public;
        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Los assets llevan huella en el nombre, así que se pueden cachear indefinidamente.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            include fastcgi_params;
            fastcgi_read_timeout 60s;
            fastcgi_hide_header X-Powered-By;

            # Laravel envía la política de seguridad de contenido, las cabeceras de
            # precarga de assets y la cookie de sesión en la misma respuesta. Con el búfer
            # de 4 KB por defecto, nginx corta y devuelve 502 sin explicar por qué.
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 32k;
            fastcgi_busy_buffers_size 64k;
        }

        # Nada fuera de `public` se sirve, y los ocultos tampoco.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
