; Nginx, PHP-FPM y el worker de colas en un solo contenedor. Dokploy escala la unidad
; completa; separar el worker exigiría otra aplicación y otra imagen para el mismo código.
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; `--max-time` recicla el worker cada hora: los trabajos largos de IA y exportación
; acumulan memoria y un proceso eterno acaba pagándolo.
; Sin `--queue`, el worker solo consumiría la cola por defecto y los trabajos de IA,
; documentos y notificaciones quedarían sin procesar (defecto corregido en I-28, que
; además tradujo los nombres de las colas).
[program:queue]
command=php /var/www/html/artisan queue:work --queue=critica,notificaciones,documentos,ia,integraciones,general --sleep=1 --tries=3 --max-time=3600
user=www-data
autorestart=true
priority=30
stopwaitsecs=65
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
